name: guek altyazi

on:
  schedule:
    # Her 5 saatte bir çalışarak GitHub Actions 6 saatlik limitine takılmadan kendini yeniler
    - cron: '0 */5 * * *'
  workflow_dispatch: # İstediğiniz zaman manuel başlatabilmeniz için

jobs:
  stream:
    runs-on: ubuntu-latest
    
    steps:
    - name: Depoyu Klonla (Repository Checkout)
      uses: actions/checkout@v4

    - name: Python Kurulumu
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: FFmpeg ve Gerekli Paketleri Yükle
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg
        python -m pip install --upgrade pip
        pip install requests

    - name: Canlı Yayını Başlat
      env:
        # Gist güncellemeleri için GitHub Token
        GH_TOKEN: ${{ secrets.GH_TOKEN }}
      run: |
        python altyaazi.py
