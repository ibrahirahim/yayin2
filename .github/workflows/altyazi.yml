name: altyazi

on:
  schedule:
    - cron: '0 */5 * * *'
  workflow_dispatch:

jobs:
  stream:
    runs-on: ubuntu-latest
    
    steps:
    - name: Depoyu Klonla
      uses: actions/checkout@v4

    - name: Python Kurulumu
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: FFmpeg ve Font Kütüphanelerini Yükle
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg fonts-freefont-ttf fontconfig
        python -m pip install --upgrade pip
        pip install requests

    - name: Canlı Yayını Başlat
      env:
        GH_TOKEN: ${{ secrets.GH_TOKEN }}
      run: |
        python altyazi.py
