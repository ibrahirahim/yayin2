name: planet premium

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  yayin:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
    - name: 📥 Depoyu klonla
      uses: actions/checkout@v4
      
    - name: 🐍 Python Kurulumu
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        
    - name: 📦 Bağımlılıkları Hızlı Yükle
      run: |
        python -m pip install --upgrade pip
        pip install requests
        
    - name: 🚀 Yayını Başlat
      env:
        GH_TOKEN: ${{ secrets.GH_TOKEN }}
        PYTHONUNBUFFERED: "1"
      run: python Planetp.py
