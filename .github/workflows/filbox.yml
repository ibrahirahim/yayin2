name: SSH101.com Yayın
on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'playlist.m3u'
      - 'title.txt'
  workflow_dispatch:
jobs:
  yayin:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
    - name: 📥 Depoyu klonla
      uses: actions/checkout@v4
      
    - name: 🐍 Python kurulumu
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        
    - name: 📦 Gereksinimleri yükle
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core
        pip install requests
        
    - name: 🎬 Yayın scriptini oluştur
      run: |
        cat > yayin.py << 'EOF'
        import subprocess
        import time
        import os
        import threading
        import requests

        RTMP_URL = "rtmp://ssh101.bozztv.com:1935/ssh101"
        STREAM_KEY = "fil2"
        rtmp_server = f"{RTMP_URL}/{STREAM_KEY}"

        M3U_SOURCE = "https://raw.githubusercontent.com/ibrahirahim/yayin2/refs/heads/main/filbox.m3u"
        LOGO_URL = "https://i.hizliresim.com/4ovbzg4.png"
        FONT_PATH = "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf"
        STREAM_USER_AGENT = "VLC/3.0.18 LibVLC/3.0.18"

        def m3u_dan_listeyi_cek(m3u_url):
            try:
                cache_buster = f"?t={int(time.time())}"
                response = requests.get(
                    m3u_url + cache_buster, timeout=15,
                    headers={"Cache-Control": "no-cache", "Pragma": "no-cache", "User-Agent": STREAM_USER_AGENT}
                )
                response.raise_for_status()
                m3u_icerik = response.text
                
                liste = []
                baslik = None
                for satir in m3u_icerik.split('\n'):
                    satir = satir.strip()
                    if satir.startswith('#EXTINF'):
                        if ',' in satir:
                            baslik = satir.split(',', 1)[1].strip()
                    elif satir.startswith('http'):
                        if not baslik:
                            baslik = os.path.basename(satir.split('?')[0]) or "Bilinmeyen Film"
                        liste.append({"title": baslik, "url": satir})
                        baslik = None
                return liste
            except Exception as e:
                print(f"❌ M3U çekme hatası: {e}")
                return []

        def download_logo():
            try:
                response = requests.get(LOGO_URL, timeout=15)
                with open('logo.png', 'wb') as f:
                    f.write(response.content)
            except Exception as e:
                print(f"⚠️ Logo indirilemedi: {e}")

        def video_suresini_al(url):
            try:
                result = subprocess.run(
                    ["ffprobe", "-v", "error", "-user_agent", STREAM_USER_AGENT,
                     "-show_entries", "format=duration", "-of", "default=noprint_wrappers=1:nokey=1", url],
                    capture_output=True, text=True, timeout=20
                )
                return float(result.stdout.strip())
            except Exception:
                return None

        def sure_formatla(saniye):
            saniye = max(0, int(saniye))
            saat = saniye // 3600
            dakika = (saniye % 3600) // 60
            san = saniye % 60
            return f"{saat:02d}:{dakika:02d}:{san:02d}" if saat > 0 else f"{dakika:02d}:{san:02d}"

        def sure_guncelleyici(baslik, toplam_sure, baslangic, durdur_event):
            while not durdur_event.is_set():
                try:
                    kalan = toplam_sure - (time.time() - baslangic) if toplam_sure else 0
                    metin = f"{baslik}\nKalan: {sure_formatla(kalan)}" if toplam_sure else baslik
                    with open("title.txt", "w", encoding="utf-8") as f:
                        f.write(metin)
                except: pass
                durdur_event.wait(1)

        def start_stream():
            video_sayaci = 0
            while True:
                playlist = m3u_dan_listeyi_cek(M3U_SOURCE)
                if not playlist:
                    print("⚠️ Liste boş. 10 saniye sonra tekrar denenecek...")
                    time.sleep(10)
                    continue

                secilen = playlist[video_sayaci % len(playlist)]
                video_sayaci += 1

                toplam_sure = video_suresini_al(secilen["url"])
                durdur_event = threading.Event()
                guncelleyici = threading.Thread(target=sure_guncelleyici, args=(secilen["title"], toplam_sure, time.time(), durdur_event), daemon=True)
                guncelleyici.start()

                print(f"▶ Yayınlanıyor: {secilen['title']}")

                filter_str = (
                    '[0:v]scale=1280:720:force_original_aspect_ratio=decrease,pad=1280:720:(ow-iw)/2:(oh-ih)/2:black[v0];'
                    '[1:v]scale=-1:90[logo];[v0][logo]overlay=W-w-10:10[vlogo];'
                    f'[vlogo]drawtext=fontfile={FONT_PATH}:textfile=title.txt:reload=1:fontcolor=white:fontsize=16:line_spacing=6:x=23:y=h-text_h-20[v]'
                ) if os.path.exists('logo.png') else (
                    '[0:v]scale=1280:720:force_original_aspect_ratio=decrease,pad=1280:720:(ow-iw)/2:(oh-ih)/2:black[v0];'
                    f'[v0]drawtext=fontfile={FONT_PATH}:textfile=title.txt:reload=1:fontcolor=white:fontsize=18:line_spacing=6:x=20:y=h-text_h-20[v]'
                )
                
                logo_input = ['-i', 'logo.png'] if os.path.exists('logo.png') else []
                
                command = [
                    'ffmpeg', '-user_agent', STREAM_USER_AGENT, '-re', '-i', secilen["url"]
                ] + logo_input + [
                    '-filter_complex', filter_str,
                    '-map', '[v]', '-map', '0:a?', '-c:v', 'libx264', '-preset', 'veryfast',
                    '-pix_fmt', 'yuv420p', '-b:v', '4000k', '-maxrate', '4000k', '-bufsize', '8000k',
                    '-g', '50', '-c:a', 'aac', '-b:a', '128k', '-ar', '44100', '-f', 'flv', rtmp_server
                ]

                subprocess.Popen(command).wait()
                durdur_event.set()
                time.sleep(2)

        if __name__ == "__main__":
            download_logo()
            start_stream()
        EOF
        echo "✅ Yayın scripti başarıyla oluşturuldu."
        
    - name: 🚀 Yayını başlat
      run: python yayin.py
